<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560" fill="none">
  <defs>
    <linearGradient id="jarBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.85" />
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0B4F9C" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="capBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <radialGradient id="jarShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Meter gradient for Jar label -->
    <linearGradient id="jarMeter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <!-- Base Shadow -->
  <ellipse cx="200" cy="530" rx="140" ry="24" fill="url(#jarShadow)" />

  <!-- 20 Litre Bubble Top Jar Body -->
  <!-- Neck and Spout Top -->
  <path d="M 170 30 L 230 30 L 230 65 L 170 65 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="2" />
  <!-- Sealed Dust Cap -->
  <rect x="165" y="15" width="70" height="24" rx="4" fill="url(#capBlue)" stroke="#0B4F9C" stroke-width="1.5" />
  <rect x="175" y="22" width="50" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.6" />

  <!-- Jar Neck Flare -->
  <path d="M 170 65 C 170 100 130 115 100 145 L 90 160 L 310 160 L 300 145 C 270 115 230 100 230 65 Z" fill="url(#jarBodyGrad)" stroke="#0284C7" stroke-width="2" />

  <!-- Main Ribbed Cylindrical Barrel -->
  <rect x="85" y="160" width="230" height="340" rx="28" fill="url(#jarBodyGrad)" stroke="#0284C7" stroke-width="2.5" />

  <!-- Horizontal Strengthening Ribs -->
  <path d="M 85 220 C 140 230 260 230 315 220" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="5" fill="none" />
  <path d="M 85 285 C 140 295 260 295 315 285" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5" fill="none" />
  <path d="M 85 350 C 140 360 260 360 315 350" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5" fill="none" />
  <path d="M 85 415 C 140 425 260 425 315 415" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="5" fill="none" />

  <!-- Recessed Handle Area -->
  <rect x="175" y="275" width="50" height="15" rx="7.5" fill="#0B4F9C" fill-opacity="0.35" stroke="#BAE6FD" stroke-width="1.5" />

  <!-- Prominent Central Brand Label matching Bottle Logo -->
  <g transform="translate(110, 305)">
    <rect x="0" y="0" width="180" height="135" rx="14" fill="#FFFFFF" fill-opacity="0.94" stroke="#0B4F9C" stroke-width="2" />
    
    <!-- Speedo Arc & Droplet -->
    <g transform="translate(100, 12)">
      <path d="M 0 16 A 16 16 0 0 1 20 4" stroke="url(#jarMeter)" stroke-width="3" stroke-linecap="round" fill="none" />
      <circle cx="10" cy="16" r="2" fill="#0B4F9C" />
      <line x1="10" y1="16" x2="18" y2="8" stroke="#0B4F9C" stroke-width="1.8" stroke-linecap="round" />
      <!-- Mini Droplet with white swoosh -->
      <path d="M 28 4 C 28 4 18 16 18 24 C 18 30 23 34 28 34 C 33 34 38 30 38 24 C 38 16 28 4 28 4 Z" fill="#0284C7" />
      <path d="M 22 25 C 24 28 28 28 32 26" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" />
    </g>

    <!-- ALKA BOOST Text on Label -->
    <text x="18" y="32" font-family="'Inter', sans-serif" font-style="italic" font-weight="900" font-size="19" fill="#0099FF">
      ALKA
    </text>
    <text x="18" y="52" font-family="'Inter', sans-serif" font-style="italic" font-weight="900" font-size="22" fill="#0B4F9C">
      BOOST
    </text>
    <text x="18" y="66" font-family="'Inter', system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#0284C7">
      Pure Water. Better Living.
    </text>

    <!-- pH badge & capacity -->
    <rect x="18" y="74" width="144" height="26" rx="13" fill="#0B4F9C" />
    <text x="90" y="91" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#FFFFFF">
      pH 8.5 – 9.5 • ALKALINE
    </text>

    <text x="90" y="118" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#0284C7">
      20 LITRES REFILL JAR
    </text>
  </g>

  <!-- Left Gloss Highlight Reflection -->
  <path d="M 100 175 L 100 480" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-opacity="0.5" />
  <path d="M 112 185 L 112 470" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.3" />

  <!-- Sealed Hygenic Tag -->
  <g transform="translate(235, 45)">
    <circle cx="20" cy="20" r="18" fill="#10B981" />
    <path d="M 12 20 L 17 25 L 28 14" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
